<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Stats Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            background-color: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
        }

        #stats-container {
            display: flex; flex-direction: column; gap: 6px;
            padding: 10px; width: 100vw; box-sizing: border-box;
        }

        .header-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 8px 12px;
            animation: box-glitch 3s infinite;
        }

        .pfp {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            filter: grayscale(100%) contrast(1.2);
        }

        .channel-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .counter-box {
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 13px;
            color: #ffffff;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: box-glitch 3s infinite;
        }

        .counter-box span {
            color: #ffffff;
            font-size: 16px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            height: 10px;
            width: 10px;
            background-color: #ff0000;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #ff0000;
            animation: blink 1.5s infinite;
        }

        .dot.offline {
            background-color: #555555;
            box-shadow: none;
            animation: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes box-glitch {
            0%, 90%, 100% { transform: translate(0); border-color: rgba(255, 255, 255, 0.2); }
            91% { transform: translate(-2px, 1px); border-color: rgba(255, 0, 0, 0.4); }
            92% { transform: translate(2px, -1px); border-color: rgba(0, 255, 255, 0.4); }
            93% { transform: translate(0); border-color: rgba(255, 255, 255, 0.2); }
        }
    </style>
</head>
<body>
    <div id="stats-container">
        <div class="header-box">
            <img src="https://static-cdn.jtvnw.net/jtv_user_pictures/2086c5f7-0a23-4f03-b5f8-202893a8f660-profile_image-70x70.png" class="pfp" alt="PFP">
            <div class="channel-name">pra1m1ch</div>
        </div>

        <div class="counter-box">
            <div class="live-indicator">
                <div class="dot offline" id="live-dot"></div>
                СМОТРЯТ
            </div>
            <span id="viewer-count">...</span>
        </div>

        <div class="counter-box">
            ФОЛЛОВЕРЫ <span id="follow-count">...</span>
        </div>
    </div>

    <script>
        const CHANNEL = 'pra1m1ch';
        const followCountEl = document.getElementById('follow-count');
        const viewerCountEl = document.getElementById('viewer-count');
        const liveDot = document.getElementById('live-dot');

        async function updateFollowers() {
            try {
                const res = await fetch(`https://api.ivr.fi/v2/twitch/user?login=${CHANNEL}`);
                const data = await res.json();
                if (data && data.length > 0 && data[0].followers !== undefined) {
                    followCountEl.textContent = data[0].followers;
                }
            } catch (e) {}
        }

        async function updateViewers() {
            try {
                const res = await fetch(`https://decapi.me/twitch/viewercount/${CHANNEL}`);
                const text = await res.text();
                
                if (text.includes('offline')) {
                    viewerCountEl.textContent = 'OFFLINE';
                    liveDot.classList.add('offline');
                } else {
                    viewerCountEl.textContent = text;
                    liveDot.classList.remove('offline');
                }
            } catch (e) {}
        }

        updateFollowers();
        updateViewers();

        setInterval(updateFollowers, 1000);
        setInterval(updateViewers, 1000);
    </script>
</body>
</html>
