<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Chat Widget</title>
    <style>
        html, body {
            background-color: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #debug { color: red; font-size: 20px; font-weight: bold; padding: 20px; text-shadow: 1px 1px 2px black; }
        #chat-container {
            display: flex; flex-direction: column; gap: 8px; padding: 10px;
            height: 100vh; box-sizing: border-box; justify-content: flex-end; overflow-y: hidden;
        }
        .chat-msg {
            background: rgba(15, 15, 15, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; padding: 8px 12px; font-size: 14px; color: #fff; word-break: break-word;
        }
        .chat-user { font-weight: bold; margin-right: 4px; }
        .chat-text { color: #e0e0e0; }
        .chat-badge { width: 16px; height: 16px; vertical-align: middle; }
        .chat-emote { vertical-align: middle; max-height: 24px; }
    </style>
</head>
<body>

    <!-- Блок для отображения ошибок -->
    <div id="debug">Загрузка...</div>
    <div id="chat-container"></div>

    <script>
        document.getElementById('debug').innerText = "Статус: Загрузка библиотеки...";

        // Пробуем загрузить tmi.js
        const script = document.createElement('script');
        script.src = "https://unpkg.com/tmi.js@1.8.5/dist/tmi.min.js";
        
        script.onload = function() {
            document.getElementById('debug').innerText = "Статус: Библиотека загружена. Подключение к чату...";
            startChat();
        };
        
        script.onerror = function() {
            document.getElementById('debug').innerText = "ОШИБКА: OBS блокирует загрузку tmi.js!";
        };
        
        document.head.appendChild(script);

        function startChat() {
            const CHANNEL_NAME = 'pra1m1ch'; // Замени на 'busters' для теста, если стример офлайн
            const chatContainer = document.getElementById('chat-container');

            const client = new tmi.Client({
                connection: { secure: true, reconnect: true },
                channels: [CHANNEL_NAME]
            });

            client.connect().then(() => {
                document.getElementById('debug').innerText = ""; // Скрываем ошибку при успехе
            }).catch(err => {
                document.getElementById('debug').innerText = "ОШИБКА ПОДКЛЮЧЕНИЯ: " + err;
            });

            client.on('message', (target, context, msg, self) => {
                if (self) return;
                document.getElementById('debug').innerText = ""; // Скрываем ошибку если пошло сообщение

                const msgDiv = document.createElement('div');
                msgDiv.className = 'chat-msg';

                if (context.badges && context.badges.moderator) {
                    const img = document.createElement('img');
                    img.className = 'chat-badge';
                    img.src = 'https://static-cdn.jtvnw.net/badges/v1/3267646d-33f0-4b17-b3df-f923a41db1d0/1';
                    msgDiv.appendChild(img);
                }

                const userSpan = document.createElement('span');
                userSpan.className = 'chat-user';
                userSpan.style.color = context['color'] || '#ffffff'; 
                userSpan.textContent = (context['display-name'] || context.username) + ':';
                msgDiv.appendChild(userSpan);

                const textSpan = document.createElement('span');
                textSpan.className = 'chat-text';
                textSpan.textContent = " " + msg;
                msgDiv.appendChild(textSpan);

                chatContainer.appendChild(msgDiv);
                
                if (chatContainer.children.length > 50) {
                    chatContainer.removeChild(chatContainer.firstChild);
                }
            });
        }
    </script>
</body>
</html>
