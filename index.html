<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Chat Only</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            background-color: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
        }
        
        #chat-container {
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            padding: 10px;
            height: 100vh; 
            box-sizing: border-box; 
            justify-content: flex-end; 
            overflow-y: auto; 
            scrollbar-width: none; 
        }

        #chat-container::-webkit-scrollbar { 
            display: none; 
        }

        .chat-msg {
            background: rgba(10, 10, 10, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px; 
            padding: 8px 12px; 
            font-size: 14px;
            color: #ffffff; 
            word-break: break-word;
            display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
            position: relative;
            animation: box-glitch 3s infinite, slideUp 0.2s ease-out;
            flex-shrink: 0; 
            transition: opacity 1s ease, transform 1s ease;
        }

        .chat-msg.removing {
            opacity: 0;
            transform: translateY(-10px);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-text {
            animation: text-glitch 4s infinite;
        }

        @keyframes box-glitch {
            0%, 90%, 100% { transform: translate(0); border-color: rgba(255, 255, 255, 0.1); }
            91% { transform: translate(-2px, 1px); border-color: rgba(255, 0, 0, 0.4); }
            92% { transform: translate(2px, -1px); border-color: rgba(0, 255, 255, 0.4); }
            93% { transform: translate(0); border-color: rgba(255, 255, 255, 0.1); }
        }

        @keyframes text-glitch {
            0%, 85%, 100% { text-shadow: none; transform: translate(0); }
            86% { text-shadow: 2px 0 red, -2px 0 cyan; transform: translate(1px, 0); }
            87% { text-shadow: -2px 0 red, 2px 0 cyan; transform: translate(-1px, 0); }
            88% { text-shadow: 2px 0 red, -2px 0 cyan; transform: translate(0); }
            89% { text-shadow: none; }
        }

        .chat-user {
            font-weight: 700; 
            margin-right: 4px;
            color: #ffffff !important;
        }

        .chat-badge {
            width: 16px; height: 16px; 
            vertical-align: middle; 
            margin-right: 2px;
            filter: grayscale(100%) brightness(0.7) contrast(1.2); 
            opacity: 0.9;
        }

        .chat-emote {
            vertical-align: middle; margin: -4px 2px; max-height: 24px;
        }
    </style>
</head>
<body>
    <div id="chat-container"></div>

    <script>
        const CHANNEL = 'pra1m1ch';
        const chatContainer = document.getElementById('chat-container');
        
        const BADGES = {
            'broadcaster': 'https://static-cdn.jtvnw.net/badges/v1/5527c58c-fb7d-422d-b71b-f309dcb85cc1/1',
            'moderator': 'https://static-cdn.jtvnw.net/badges/v1/3267646d-33f0-4b17-b3df-f923a41db1d0/1',
            'vip': 'https://static-cdn.jtvnw.net/badges/v1/b817aba4-fad8-49e2-b88a-7cc744dfa6ec/1',
            'subscriber': 'https://static-cdn.jtvnw.net/badges/v1/5d9f2208-5dd8-11e7-8513-2ff4adfae661/1',
            'turbo': 'https://static-cdn.jtvnw.net/badges/v1/bbbe0db0-a598-423e-86d0-f9fb98ca1933/1',
            'founder': 'https://static-cdn.jtvnw.net/badges/v1/511b78a9-ab37-472f-9569-457753bbe7d3/1',
            'staff': 'https://static-cdn.jtvnw.net/badges/v1/d97c37bd-a6f5-4c38-8f57-4e4bef88af34/1',
            'partner': 'https://static-cdn.jtvnw.net/badges/v1/d12a2e27-16f6-41d0-ab77-b780518f00a3/1'
        };

        let emoteMap = {};
        let ws = null;
        let pingInterval = null;
        let reconnectTimeout = null;

        async function loadGlobalEmotes() {
            try {
                const response = await fetch('https://api.twitch.tv/helix/chat/emotes/global', {
                    headers: { 'Client-ID': 'kimne78kx3ncx6brgo4mv6wki5h1ko' }
                });
                const data = await response.json();
                if (data.data) {
                    data.data.forEach(emote => {
                        emoteMap[emote.name] = `https://static-cdn.jtvnw.net/emoticons/v2/${emote.id}/default/dark/1.0`;
                    });
                }
            } catch (e) {}
        }

        loadGlobalEmotes();

        function connect() {
            if (ws) {
                ws.onopen = null;
                ws.onmessage = null;
                ws.onclose = null;
                ws.onerror = null;
                if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
                    ws.close();
                }
            }
            
            clearInterval(pingInterval);
            clearTimeout(reconnectTimeout);

            ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

            ws.onopen = () => {
                ws.send('CAP REQ :twitch.tv/tags');
                ws.send('CAP REQ :twitch.tv/commands');
                ws.send('PASS SCHMOOPIIE');
                ws.send('NICK justinfan' + Math.floor(Math.random() * 99999));
                ws.send('JOIN #' + CHANNEL);

                pingInterval = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send('PING tmi.twitch.tv');
                    }
                }, 60000);
            };

            ws.onmessage = (event) => {
                const lines = event.data.split('\r\n');
                
                lines.forEach(line => {
                    if (!line) return;

                    if (line.startsWith('PING ')) {
                        ws.send('PONG ' + line.substring(5));
                        return;
                    }

                    let tags = {};
                    if (line.startsWith('@')) {
                        const tagString = line.split(' ')[0].substring(1);
                        tagString.split(';').forEach(part => {
                            const [key, val] = part.split('=');
                            tags[key] = val;
                        });
                    }

                    if (line.includes('PRIVMSG')) {
                        const user = tags['display-name'] || line.split('!')[0].split(':')[1];
                        
                        const msgStart = line.indexOf('PRIVMSG') + line.substring(line.indexOf('PRIVMSG')).indexOf(':') + 1;
                        let msg = line.substring(msgStart);

                        if (tags['emotes']) {
                            const emotes = [];
                            tags['emotes'].split('/').forEach(emoteData => {
                                const [id, positions] = emoteData.split(':');
                                positions.split(',').forEach(pos => {
                                    const [start, end] = pos.split('-').map(Number);
                                    emotes.push({ id, start, end });
                                });
                            });
                            
                            emotes.sort((a, b) => b.start - a.start).forEach(emote => {
                                const emoteName = msg.substring(emote.start, emote.end + 1);
                                const imgTag = `<img class="chat-emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${emote.id}/default/dark/1.0" alt="${emoteName}">`;
                                msg = msg.substring(0, emote.start) + imgTag + msg.substring(emote.end + 1);
                            });
                        }

                        const words = msg.split(' ');
                        const formattedWords = words.map(word => {
                            if (emoteMap[word]) {
                                return `<img class="chat-emote" src="${emoteMap[word]}" alt="${word}">`;
                            }
                            return word;
                        });
                        msg = formattedWords.join(' ');

                        const msgDiv = document.createElement('div');
                        msgDiv.className = 'chat-msg';

                        if (tags['badges']) {
                            const badgeList = tags['badges'].split(',');
                            badgeList.forEach(b => {
                                const badgeName = b.split('/')[0];
                                if (BADGES[badgeName]) {
                                    const img = document.createElement('img');
                                    img.className = 'chat-badge';
                                    img.src = BADGES[badgeName];
                                    img.onerror = function() { this.style.display = 'none'; };
                                    msgDiv.appendChild(img);
                                }
                            });
                        }

                        const userSpan = document.createElement('span');
                        userSpan.className = 'chat-user';
                        userSpan.textContent = user + ':';
                        msgDiv.appendChild(userSpan);

                        const textSpan = document.createElement('span');
                        textSpan.className = 'chat-text';
                        textSpan.innerHTML = msg;
                        msgDiv.appendChild(textSpan);

                        chatContainer.appendChild(msgDiv);
                        chatContainer.scrollTop = chatContainer.scrollHeight;

                        setTimeout(() => {
                            msgDiv.classList.add('removing');
                            setTimeout(() => {
                                if (msgDiv.parentNode) {
                                    msgDiv.remove();
                                }
                            }, 1000);
                        }, 14000);
                    }
                });
            };

            ws.onclose = () => {
                clearInterval(pingInterval);
                reconnectTimeout = setTimeout(connect, 5000);
            };

            ws.onerror = () => {
                if (ws.readyState !== WebSocket.OPEN) {
                    ws.close();
                }
            };
        }

        connect();
    </script>
</body>
</html>
